# Minimal offline CI: one job, one Node version, production-only install.
# Tests run against the committed dist/ (freshness is checked locally with `npm run verify:dist`).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  LANG: C.UTF-8
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - run: npm run test:ci
      - run: npm run check:demo
      - name: Run the Action on the demo repository
        id: demo
        uses: ./
        with:
          command: check
          working-directory: examples/demo-skills
          claude-validate: "false"
      - name: The demo repository has no drift and no errors
        env:
          DRIFT: ${{ steps.demo.outputs.drift }}
          ERRORS: ${{ steps.demo.outputs.errors }}
        run: test "$DRIFT" = "false" && test "$ERRORS" = "0"
